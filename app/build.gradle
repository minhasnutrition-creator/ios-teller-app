plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}


android {
    namespace 'com.minhas.teller'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.minhas.teller"
        minSdk 26
        targetSdk 36
        versionCode 698
        versionName "6.7.43"


        externalNativeBuild {
            cmake {
                arguments "-DANDROID_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        
        // Read API Key from local.properties
        Properties properties = new Properties()
        if (project.rootProject.file('local.properties').exists()) {
            properties.load(project.rootProject.file('local.properties').newDataInputStream())
        }
        buildConfigField "String", "GEMINI_API_KEY", "\"${properties.getProperty('GEMINI_API_KEY', '')}\""
        buildConfigField "String", "DEEPSEEK_API_KEY", "\"${properties.getProperty('DEEPSEEK_API_KEY', '')}\""
        buildConfigField "String", "FIREBASE_APPLICATION_ID", "\"${properties.getProperty('FIREBASE_APPLICATION_ID', '')}\""
        buildConfigField "String", "FIREBASE_API_KEY", "\"${properties.getProperty('FIREBASE_API_KEY', '')}\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"${properties.getProperty('FIREBASE_PROJECT_ID', '')}\""
        buildConfigField "String", "FIREBASE_DATABASE_URL", "\"${properties.getProperty('FIREBASE_DATABASE_URL', '')}\""
        buildConfigField "String", "FIREBASE_STORAGE_BUCKET", "\"${properties.getProperty('FIREBASE_STORAGE_BUCKET', '')}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${properties.getProperty('GOOGLE_WEB_CLIENT_ID', '')}\""
        buildConfigField "boolean", "FORCE_FULL_LICENSE", "false"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            Properties signingProps = new Properties()
            if (project.rootProject.file('local.properties').exists()) {
                signingProps.load(project.rootProject.file('local.properties').newDataInputStream())
            }
            storeFile file(signingProps.getProperty('RELEASE_STORE_FILE', 'release-key.jks'))
            storePassword signingProps.getProperty('RELEASE_STORE_PASSWORD', '')
            keyAlias signingProps.getProperty('RELEASE_KEY_ALIAS', '')
            keyPassword signingProps.getProperty('RELEASE_KEY_PASSWORD', '')
        }
    }

    buildTypes {

                debug {
                    buildConfigField "boolean", "FORCE_FULL_LICENSE", "true"
                }
                release {
                    minifyEnabled true
                    shrinkResources false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    signingConfig signingConfigs.release
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
                }
            }
        
        compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    ksp {
        arg('room.schemaLocation', "$projectDir/schemas")
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    buildFeatures {
        compose true
        buildConfig = true
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/NOTICE'
            doNotStrip "**/*.so"
        }
    }
}

dependencies {

    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.core:core:1.13.1'
    // androidx.multidex removed: minSdk is 26, so ART handles multidex natively and AGP warns
    // that the support library is dead weight. multiDexEnabled above is a no-op at this minSdk.

    // Compose BOM - aligns all Compose library versions
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.runtime:runtime-livedata'
    
    // Room Database
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    
    // Kotlin (stdlib auto-included with Kotlin 2.0+)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    
    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    
    // Google APIs
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    // Sign in with Google: the legacy GoogleSignInClient API (com.google.android.gms.auth.api.signin)
    // is deprecated and removed from current Play Services — Credential Manager is its replacement.
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    // ── ML Kit standalone (bundled models – fully offline, no Play Services download) ──
    implementation 'com.google.mlkit:text-recognition:16.0.1'                     // Latin / English
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'           // Hindi / Devanagari
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    // On-device (offline, free) smart scanning: barcode, image labeling, entity extraction.
    // Bundled model (not the play-services-mlkit-* variant) — the model ships inside the APK,
    // so scanning works immediately offline instead of depending on a Play Services model
    // download that can silently never finish.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // CameraX — live camera preview + analysis for the in-app QR scanner (no Play Services dependency)
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    implementation 'com.google.mlkit:entity-extraction:16.0.0-beta6'
    // Tesseract OCR — free, offline, covers all Indian scripts (Tamil, Telugu, Bengali, etc.)
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'   // EXIF rotation for OCR preprocessing
    
    // Google Play Services
    implementation 'com.google.android.gms:play-services-basement:18.4.0'
    implementation 'com.google.android.gms:play-services-base:18.4.0'
    
    // Google Play Services
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    // Crash reporting (Kotlin exceptions + native SIGSEGV/SIGABRT signals). The Crashlytics
    // *Gradle plugin* is skipped because it's not AGP 9.0-compatible; mapping/native-symbol upload
    // must be done via the Firebase CLI until a compatible plugin ships. See firebase_config.xml.
    implementation 'com.google.firebase:firebase-crashlytics'
    // Calls the verifyPurchase / revalidateLicense Cloud Functions (see /functions) that check
    // purchases against the Play Developer API server-side, instead of the app trusting itself.
    implementation 'com.google.firebase:firebase-functions'
    // Play Integrity (includes core-common:2.0.3)
    implementation 'com.google.android.play:integrity:1.3.0'
    
    // Play Billing — Play Console requires 8.0.0+ by Aug 31, 2026 (deadline for app updates to
    // be accepted). Using 8.3.0, the latest stable 8.x release.
    implementation 'com.android.billingclient:billing:8.3.0'
    
    // Export Libraries
    // OpenPDF — MPL 2.0 licensed fork of iText, drop-in replacement.
    // Replaces AGPL-licensed iText 5.5.10 which is EOL since 2020.
    implementation 'com.github.librepdf:openpdf:2.0.3'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'javax.xml.stream:stax-api:1.0'
    implementation 'com.fasterxml:aalto-xml:1.3.2'
    
    // AI/ML
    implementation 'org.apache.commons:commons-math3:3.6.1'
    // MediaPipe LLM - 16KB-aligned versions (0.10.25+) - on-device only, no cloud AI
    implementation 'com.google.mediapipe:tasks-genai:0.10.33'

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'
    
    // Encrypted SharedPreferences for license / sensitive values
    implementation 'androidx.security:security-crypto:1.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // org.json on the JVM classpath so the pure GST JSON builders are unit-testable off-device
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}


